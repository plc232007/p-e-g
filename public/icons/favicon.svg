<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e6b"/>
      <stop offset="100%" stop-color="#1e2d52"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c49a55"/>
      <stop offset="100%" stop-color="#dab978"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(196,154,85,0.08)" stroke-width="1"/>
  <!-- Cross -->
  <rect x="240" y="100" width="32" height="280" rx="6" fill="url(#cross)"/>
  <rect x="176" y="172" width="160" height="28" rx="6" fill="url(#cross)"/>
  <!-- Wedding ring / alliance arc (left) -->
  <ellipse cx="216" cy="350" rx="48" ry="32" fill="none" stroke="#c49a55" stroke-width="3.5" opacity="0.7"
    transform="rotate(-12, 216, 350)"/>
  <!-- Wedding ring / alliance arc (right) -->
  <ellipse cx="296" cy="350" rx="48" ry="32" fill="none" stroke="#dab978" stroke-width="3.5" opacity="0.6"
    transform="rotate(12, 296, 350)"/>
  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="rgba(196,154,85,0.15)" stroke-width="2"/>
</svg>
